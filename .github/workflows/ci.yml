# Quality gates: lint → build (warnings are errors) → tests → package (.app → DMG + zip).
# Runs on every pull request into develop or main, and is reused by the deploy workflows
# so DEV and PROD builds pass exactly the same gates.
name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:   # lets automation run CI on a branch it created (e.g. release/vX.Y.Z)
  workflow_call:
    inputs:
      version:
        description: "Version to stamp into the app (default: latest tag, else version.env)"
        type: string
        default: ""

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, build, test, package
    # Liquid Glass APIs need the macOS 26 SDK (Xcode 26+).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags + full history: version and build number come from git

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Package universal app
        env:
          VERSION: ${{ inputs.version }}
        run: ARCHES="arm64 x86_64" scripts/package_app.sh release

      - name: Verify bundle
        run: |
          lipo -archs build/Shelfy.app/Contents/MacOS/Shelfy
          codesign --verify --strict --verbose=2 build/Shelfy.app
          plutil -lint build/Shelfy.app/Contents/Info.plist

      - name: Make DMG and zip
        run: scripts/make_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: shelfy-build
          path: |
            build/Shelfy-*.dmg
            build/Shelfy-*.zip
          retention-days: 14
